<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/vista-logo.png" />
    <title>VISTA PRESENTS THE VERDICT — Universal Live Auction Platform | NMAMIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes vistaPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.98); } }
      @keyframes vistaSpin { to { transform: rotate(360deg); } }
      .vista-loader-spinner { animation: vistaSpin 0.9s linear infinite; }
      .vista-loader-pulse { animation: vistaPulse 2s ease-in-out infinite; }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="min-height:100vh;background:#07090E;color:#F87171;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;">' +
            '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
            '<div style="font-size:18px;font-weight:800;color:#FFF;margin-bottom:8px;">Failed to start live application</div>' +
            '<div style="font-size:12px;color:#FCA5A5;max-width:500px;margin-bottom:20px;font-family:monospace;background:#1E1B2E;padding:12px;border-radius:12px;border:1px solid #4C1D24;">' + (e.message || 'Script execution failed') + '</div>' +
            '<button onclick="window.location.reload()" style="background:#F59E0B;color:#07090E;border:none;font-weight:800;font-size:12px;padding:10px 20px;border-radius:12px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;">Reload Screen</button>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-[#07090E] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07090E; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; gap: 16px; padding: 24px; text-align: center;">
        <div style="height: 48px; width: 48px; border-radius: 50%; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #F59E0B;" class="vista-loader-spinner"></div>
        <div class="vista-loader-pulse">
          <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #F59E0B;">
            VISTA PRESENTS THE VERDICT
          </div>
          <div style="font-size: 11px; font-weight: 600; color: #64748B; margin-top: 4px; letter-spacing: 0.05em;">
            Initializing Universal Live Auction Platform...
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
